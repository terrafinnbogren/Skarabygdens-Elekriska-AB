name: Bygg och kontrollera

on:
  push:
  pull_request:

jobs:
  hemsida:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hemsida
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm run check
